name: Runtime benchmark
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Isolated measurement or separate diagnostic profile
        options: [benchmark, profile]
        default: benchmark
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: 0
      GOMAXPROCS: 2
      GOMEMLIMIT: 512MiB
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: go build -o bin/runtime ./cmd/runtime
      - run: python -m unittest discover -s tools -p test_benchmark.py -v
      - run: python tools/benchmark.py smoke
      - run: python tools/benchmark.py ${{ inputs.mode }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: runtime-benchmark-${{ inputs.mode }}-${{ github.sha }}
          path: |
            .runs/benchmark-*/summary.json
            .runs/benchmark-*/trial-*/result.json
            .runs/benchmark-*/trial-*/resources.json
            .runs/benchmark-*/trial-*/*.log
            .runs/benchmark-*/*.pstats
          include-hidden-files: true
          retention-days: 14
